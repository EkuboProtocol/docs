[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# No `solc` pin: foundry auto-detects per file (0.8.26 driver files, =0.8.33 ekubo sources).
optimizer = true
optimizer_runs = 1000000
via_ir = true
evm_version = "osaka"
verbosity = 2
fs_permissions = [{ access = "read-write", path = "./" }]
